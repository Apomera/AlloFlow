<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="referrer" content="no-referrer" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' https://script.google.com https://script.googleusercontent.com; object-src 'none'; base-uri 'self'" />
  <meta name="theme-color" content="#10233f" />
  <title>AlloFlow Educator Growth &amp; Evaluation</title>
  <meta name="description" content="Private on-device workspace for educator walkthroughs, formal observations, and growth trends. Nothing uploads unless you connect a district portal." />
  <link rel="canonical" href="https://alloflow-cdn.pages.dev/educator-evaluation" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="AlloFlow Educator Growth &amp; Evaluation" />
  <meta property="og:description" content="A private on-device workspace for educator walkthroughs, formal observations, and growth trends. Nothing is uploaded." />
  <meta property="og:url" content="https://alloflow-cdn.pages.dev/educator-evaluation" />
  <meta property="og:image" content="https://alloflow-cdn.pages.dev/educator-evaluation-manual-assets/02-overview.jpg" />
  <meta name="twitter:card" content="summary_large_image" />
  <link rel="icon" type="image/svg+xml" href="./allobot.svg" />
  <link rel="apple-touch-icon" href="./allobot.png" />
  <style>
    html,body,#educator-evaluation-root{min-height:100%;margin:0}
    body{background:#f4f7fb;color:#24324a}
    .boot{font:16px system-ui;color:#24324a;min-height:100vh;display:grid;place-items:center;text-align:center;padding:24px}
    .boot h1{display:block;font-size:22px;color:#173e70;margin:0 0 6px}
    .boot a{display:inline-flex;align-items:center;min-height:44px;padding:6px 12px;border-radius:6px;color:#1d4ed8;font-weight:700}
    .boot a:focus-visible{outline:3px solid #1d4ed8;outline-offset:2px}
    html[data-ae-theme="dark"] body{background:#0f172a;color:#e6ebf5}
    html[data-ae-theme="dark"] .boot{color:#e2e8f0}
    html[data-ae-theme="dark"] .boot h1{color:#f8fafc}
    html[data-ae-theme="dark"] .boot a{color:#93c5fd}
    html[data-ae-theme="dark"] .boot a:focus-visible{outline-color:#93c5fd}
    html[data-ae-theme="contrast"] body{background:#000000;color:#ffffff}
    html[data-ae-theme="contrast"] .boot{color:#ffffff}
    html[data-ae-theme="contrast"] .boot h1{color:#ffff00}
    html[data-ae-theme="contrast"] .boot a{color:#00ff00}
    html[data-ae-theme="contrast"] .boot a:focus-visible{outline-color:#00ff00}
    .skip-link{position:absolute;inset-inline-start:8px;top:8px;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap;z-index:10000}
    .skip-link:focus{position:fixed;inset-inline-start:8px;top:8px;width:auto;height:auto;overflow:visible;clip-path:none;white-space:normal;padding:10px 18px;background:#10233f;color:#fff;font:700 14px system-ui;border-radius:8px;outline:3px solid #facc15;text-decoration:none}
    @media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
    @media (forced-colors: active){.boot,.boot h1,.boot a{color:CanvasText}}
  </style>
</head>
<body>
  <a class="skip-link" href="#educator-evaluation-root">Skip to main content</a>
  <div id="educator-evaluation-root" tabindex="-1"><main class="boot"><div><h1>Educator Growth &amp; Evaluation</h1><p role="status" aria-live="polite">Loading the principal workspace…</p><p style="margin-top:14px;font-size:14px"><a href="./educator-evaluation-manual.html">Read the user manual</a></p></div></main></div>
  <script>(function(){try{var m=window.matchMedia;function sync(){var theme=m&&m('(prefers-contrast: more)').matches?'contrast':(m&&m('(prefers-color-scheme: dark)').matches?'dark':'light');document.documentElement.setAttribute('data-ae-theme',theme);document.body.style.background=theme==='dark'?'#0f172a':(theme==='contrast'?'#000':'#f4f7fb');document.body.style.color=theme==='light'?'#24324a':'#e6ebf5';}sync();if(m){['(prefers-contrast: more)','(prefers-color-scheme: dark)'].forEach(function(q){var mq=m(q);if(mq&&typeof mq.addEventListener==='function')mq.addEventListener('change',sync);});}}catch(e){}})();</script>
  <script src="./educator_evaluation_standalone.js"></script>
</body>
</html>
