<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="283mm" viewBox="0 0 210 283" role="img" aria-labelledby="drawing-title" aria-describedby="drawing-description">
<title id="drawing-title">Scale Explorer · scale drawing</title><desc id="drawing-description">Each line represents its stated dimension. Dashed dimension lines are distances, not object diameters. This compares lengths; it does not map positions, areas or volumes. Compare worlds, a person and microscopic widths at one scale. Model length = real length × 1.15 × 10⁻¹⁰. One model centimetre represents 8.7 × 10⁷ m. The Sun: 1.39 × 10⁹ m · across → 160 mm The Moon: 3.48 × 10⁶ m · across → 0.399 mm The Earth: 1.27 × 10⁷ m · across → 1.46 mm Jupiter: 1.43 × 10⁸ m · across → 16.4 mm A person: 1.7 m · tall → 1.95 × 10⁻⁷ mm A red blood cell: 7.5 × 10⁻⁶ m · across → 8.62 × 10⁻¹³ mm The width of a DNA double helix: 2.4 × 10⁻⁹ m · across → 2.76 × 10⁻¹⁶ mm A Tyrannosaurus rex: 12 m · long → 1.38 × 10⁻⁶ mm 10 mm calibration ruler Print at 100% scale. Check the 10 mm ruler with a real ruler; fit-to-page printing changes the dimensions. Each line represents its stated dimension. Dashed dimension lines are distances, not object diameters. This compares lengths; it does not map positions, areas or volumes. Dashed locators mark dimensions below 0.5 mm without enlarging them.</desc>
<rect width="210" height="283" fill="white"/><g font-family="sans-serif" fill="#172033">
<text x="15" y="12" font-size="5">Scale Explorer · scale drawing</text>
<text x="15" y="21" font-size="3.2">Model length = real length × 1.15 × 10⁻¹⁰. One model centimetre represents 8.7 × 10⁷ m.</text>
<text x="15" y="38" font-size="3.5">1. The Sun · 1.39 × 10⁹ m · across</text>
<g stroke="#146675" stroke-width=".55" fill="none">
<line data-drawing-measure="0" data-drawing-item="sun" data-model-mm="160" transform="translate(15 0)" x1="0" y1="50" x2="160" y2="50"/>
<path d="M15 48v4M175 48v4"/>
</g>
<text x="15" y="57" font-size="3.5">160 mm</text>
<text x="15" y="62" font-size="3.5">2. The Moon · 3.48 × 10⁶ m · across</text>
<g stroke="#92541b" stroke-width=".55" fill="none">
<line data-drawing-measure="1" data-drawing-item="moon" data-model-mm="0.3994252873563219" transform="translate(15 0)" x1="0" y1="74" x2="0.3994252873563219" y2="74"/>
<path d="M15 72v4M15.399425287356323 72v4"/>
<path data-drawing-locator="1" stroke-dasharray=".5 .5" d="M13 74h4m-2 -2v4"/>
</g>
<text x="15" y="81" font-size="3.5">0.399 mm</text>
<text x="15" y="86" font-size="3.5">3. The Earth · 1.27 × 10⁷ m · across</text>
<g stroke="#92541b" stroke-width=".55" fill="none">
<line data-drawing-measure="2" data-drawing-item="earth" data-model-mm="1.4645977011494251" transform="translate(15 0)" x1="0" y1="98" x2="1.4645977011494251" y2="98"/>
<path d="M15 96v4M16.464597701149426 96v4"/>
</g>
<text x="15" y="105" font-size="3.5">1.46 mm</text>
<text x="15" y="110" font-size="3.5">4. Jupiter · 1.43 × 10⁸ m · across</text>
<g stroke="#92541b" stroke-width=".55" fill="none">
<line data-drawing-measure="3" data-drawing-item="jupiter" data-model-mm="16.436781609195403" transform="translate(15 0)" x1="0" y1="122" x2="16.436781609195403" y2="122"/>
<path d="M15 120v4M31.436781609195403 120v4"/>
</g>
<text x="15" y="129" font-size="3.5">16.4 mm</text>
<text x="15" y="134" font-size="3.5">5. A person · 1.7 m · tall</text>
<g stroke="#92541b" stroke-width=".55" fill="none">
<line data-drawing-measure="4" data-drawing-item="human" data-model-mm="1.9540229885057472e-7" transform="translate(15 0)" x1="0" y1="146" x2="1.9540229885057472e-7" y2="146"/>
<path d="M15 144v4M15.000000195402299 144v4"/>
<path data-drawing-locator="4" stroke-dasharray=".5 .5" d="M13 146h4m-2 -2v4"/>
</g>
<text x="15" y="153" font-size="3.5">1.95 × 10⁻⁷ mm</text>
<text x="15" y="158" font-size="3.5">6. A red blood cell · 7.5 × 10⁻⁶ m · across</text>
<g stroke="#92541b" stroke-width=".55" fill="none">
<line data-drawing-measure="5" data-drawing-item="rbc" data-model-mm="8.620689655172414e-13" transform="translate(15 0)" x1="0" y1="170" x2="8.620689655172414e-13" y2="170"/>
<path d="M15 168v4M15.000000000000862 168v4"/>
<path data-drawing-locator="5" stroke-dasharray=".5 .5" d="M13 170h4m-2 -2v4"/>
</g>
<text x="15" y="177" font-size="3.5">8.62 × 10⁻¹³ mm</text>
<text x="15" y="182" font-size="3.5">7. The width of a DNA double helix · 2.4 × 10⁻⁹ m · across</text>
<g stroke="#92541b" stroke-width=".55" fill="none">
<line data-drawing-measure="6" data-drawing-item="dna" data-model-mm="2.7586206896551723e-16" transform="translate(15 0)" x1="0" y1="194" x2="2.7586206896551723e-16" y2="194"/>
<path d="M15 192v4M15 192v4"/>
<path data-drawing-locator="6" stroke-dasharray=".5 .5" d="M13 194h4m-2 -2v4"/>
</g>
<text x="15" y="201" font-size="3.5">2.76 × 10⁻¹⁶ mm</text>
<text x="15" y="206" font-size="3.5">8. A Tyrannosaurus rex · 12 m · long</text>
<g stroke="#92541b" stroke-width=".55" fill="none">
<line data-drawing-measure="7" data-drawing-item="trex" data-model-mm="0.0000013793103448275862" transform="translate(15 0)" x1="0" y1="218" x2="0.0000013793103448275862" y2="218"/>
<path d="M15 216v4M15.000001379310344 216v4"/>
<path data-drawing-locator="7" stroke-dasharray=".5 .5" d="M13 218h4m-2 -2v4"/>
</g>
<text x="15" y="225" font-size="3.5">1.38 × 10⁻⁶ mm</text>
<path data-drawing-calibration="10" d="M15 237v4m0-2h10m0-2v4" fill="none" stroke="#172033" stroke-width=".4"/>
<text x="30" y="240" font-size="3.5">10 mm calibration ruler</text>
<text x="15" y="250" font-size="3.2">Print at 100% scale. Check the 10 mm ruler with a real ruler; fit-to-page printing changes the</text>
<text x="15" y="254" font-size="3.2">dimensions.</text>
<text x="15" y="263" font-size="3">Each line represents its stated dimension. Dashed dimension lines are distances, not object</text>
<text x="15" y="267" font-size="3">diameters. This compares lengths; it does not map positions, areas or volumes. Dashed locators</text>
<text x="15" y="271" font-size="3">mark dimensions below 0.5 mm without enlarging them.</text>
