name: verify

# Automated quality gate for the push -> Cloudflare-Pages deploy path, which
# previously had NO gate (every render crash this project shipped reached the
# live pilot through an ungated push to main).
#
#   gate         — BLOCKING. The static checks that catch the bug classes that
#                  actually reached production:
#                    * render crashes: undeclared identifiers in React hook
#                      dependency arrays (data / onPlayAudio / isEscaped)
#                    * dead modules: files that don't parse / won't load
#                      (platetectonics) — check_render_refs parse-gating
#                    * corrupt lang packs (check_lang_json)
#                    * Ctrl+K command palette regressing to English-only —
#                      manifest stale or a pack missing keys (check_cmd_i18n)
#                    * broken AlloModules registry / view-module props / icons
#                  Make this a REQUIRED status check in branch protection to
#                  truly block merges to main.
#   verify-full  — NON-BLOCKING. The full ~40-check suite, for visibility. It
#                  currently surfaces known pre-existing debt (76 missing t()
#                  keys, deploy-mirror drift) — reported, not enforced, so it
#                  never blocks while that debt is paid down.
#   smoke        — NON-BLOCKING. Playwright opens each major surface against the
#                  deployed demo and asserts no fatal/ErrorBoundary. Regression
#                  detection (tests whatever is live), not a pre-merge gate.

# TRIGGERS (2026-09-22): this gate is BLOCKING and correctly aimed, but it had
# never run on a single line of the work it is meant to protect. All
# development happens on a long-lived shared branch — 212 commits ahead of
# main at the time of writing — and `branches: [main]` meant the gate only
# fired on a push to main that never came. Running it here found it already
# RED, from three separate sessions' committed work.
#
# `branches-ignore: []` runs it on every branch push. A gate that reports on
# the branch people actually commit to is the whole point; restricting it to
# main made it a gate in name only.
on:
  push:
    branches-ignore: []
  pull_request:

jobs:
  docs-integrity:
    name: Documentation + promotion integrity
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm install --no-audit --no-fund
      - name: Searchable teacher guide is current
        run: npm run verify:teacher-guide
      - name: Maintained documentation accuracy and local links
        run: npm run audit:docs
      - name: Promotional-site accuracy, accessibility, and local links
        run: npm run audit:promo

  remediation-preservation:
    name: Remediation preservation (source + browser + export)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm install --no-audit --no-fund
      - name: Install React 18 for remediation browser harnesses
        run: npm install --no-audit --no-fund --no-save --prefix desktop/web-app react@^18.2.0 react-dom@^18.2.0
      - name: Install local-fixture browser
        run: npx playwright install chromium
      - name: Source, generated module, rendered fidelity and export regressions
        run: npm run verify:remediation
      - name: Retain remediation validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: remediation-validation
          path: test-results/remediation-validation/
          if-no-files-found: warn

  gate:
    name: Static gate (crash + load classes)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm install --no-audit --no-fund
      - name: verify:gate (generated modules + render refs + module contracts)
        run: npm run verify:gate

  adventure-journey:
    name: Adventure journey (choice + free response + debate)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm install --no-audit --no-fund
      - name: Install React 18 for the Adventure browser harness
        run: npm install --no-audit --no-fund --no-save --prefix desktop/web-app react@^18.2.0 react-dom@^18.2.0
      - name: Install Playwright Chromium
        run: npx playwright install chromium
      - name: Run deterministic Adventure journeys
        run: npx playwright test tests/e2e/adventure-journey.spec.ts
      - id: allobot_visual
        name: AlloBot reviewed visual baseline
        run: npm run verify:allobot-visual
      - name: Capture AlloBot visual diagnostics
        if: failure() && steps.allobot_visual.outcome == 'failure'
        run: npm run visual:allobot
      - name: Upload AlloBot visual diagnostics
        if: failure() && steps.allobot_visual.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: allobot-visual-diagnostics
          path: test-results/allobot-visual-qa/**
          if-no-files-found: ignore

  unit:
    name: Unit tests (shard ${{ matrix.shard }}/8)
    # BLOCKING. Sharding keeps the 1,200+ file Vitest suite bounded while every
    # test still runs on each push and pull request. fail-fast is disabled so a
    # failure in one shard does not hide independent regressions in another.
    #
    # 2026-07-26 (audit finding H1): this job runs the suite MINUS tests/QUARANTINE.txt.
    # It previously ran everything with no allowlist while ~271 assertions were already red, so it
    # was permanently red — a gate that cannot change colour gates nothing, and a genuinely new
    # regression was indistinguishable from the standing noise. Quarantined files still run, in the
    # non-blocking `quarantine` job below, and `check_quarantine` fails if that list ever stops
    # shrinking honestly (a listed file that now passes, or no longer exists, must be removed).
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm install --no-audit --no-fund
      - name: Install React 18 for golden-master harnesses
        run: npm install --no-audit --no-fund --no-save --prefix desktop/web-app react@^18.2.0 react-dom@^18.2.0
      - name: Run Vitest shard
        run: npm run test:ci:shard -- --shard=${{ matrix.shard }}/8

  quarantine:
    name: Quarantined tests (non-blocking)
    # NOT blocking. Runs exactly the files the `unit` job excludes, so their status stays visible
    # instead of being swept out of sight, and fails loudly if the list has rotted — a quarantined
    # file that now PASSES must be removed, or the blocking job never protects it again.
    # This job going red is a chore, not an outage. The `unit` job going red is an outage.
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm install --no-audit --no-fund
      - name: Install React 18 for golden-master harnesses
        run: npm install --no-audit --no-fund --no-save --prefix desktop/web-app react@^18.2.0 react-dom@^18.2.0
      - name: Run quarantined tests + anti-rot check
        run: npm run test:quarantine

  research-integrations:
    name: Research integration contracts + accessibility
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm install --no-audit --no-fund
      - name: Install React 18 for Research Hub runtime tests
        run: npm install --no-audit --no-fund --no-save --prefix desktop/web-app react@^18.2.0 react-dom@^18.2.0
      - name: Verify research integrations
        run: npm run verify:research-integrations
  verify-full:
    name: Full verify suite (non-blocking visibility)
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm install --no-audit --no-fund
      - name: npm run verify (surfaces translation gaps + mirror drift)
        run: npm run verify
      - name: Translation staleness (reworded English vs existing translations)
        # Non-blocking visibility: lists packs holding a translation of an English
        # string that changed since the lang_source_baseline.json snapshot. To make
        # the signal louder, append `--gate` (still non-blocking here under the job's
        # continue-on-error). if: always() so it runs even when the verify step above
        # reports pre-existing debt and exits non-zero.
        if: always()
        run: npm run verify:stale

  smoke:
    name: Render smoke — deployed demo (non-blocking)
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm install --no-audit --no-fund
      - name: Install Playwright chromium
        run: npx playwright install chromium
      - name: Smoke — major surfaces open without a fatal error
        run: npx playwright test tests/e2e/11-render-smoke.spec.ts

  stem-plugin-recovery:
    name: STEM plugin failure recovery (BLOCKING)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm install --no-audit --no-fund
      - name: Install desktop web-app dependencies
        run: npm install --no-audit --no-fund --prefix desktop/web-app
      - name: Install Playwright chromium
        run: npx playwright install chromium
      - name: Heat and Nuclear demand-load recovery
        run: npx playwright test tests/e2e/35-stem-plugin-recovery.spec.ts --workers=1
      - name: Heat and Nuclear recovery in the local app
        run: npx playwright test --config=tests/e2e/stem-local.playwright.config.ts tests/e2e/36-stem-local-app.spec.ts --workers=1

  tag-tree:
    name: Tagged-PDF goldens (BLOCKING)
    # PROMOTED TO BLOCKING 2026-06-10 (strategic-audit item: "eight goldens,
    # two in CI and ignorable" was a credibility gap). This job carries every
    # DETERMINISTIC pipeline golden — the StructTreeRoot invariants, the
    # validator's non-vacuousness, validator/gate parity, cross-page MCR
    # linkage, and the AI-loop contracts (scripted Gemini — zero network).
    # All run the LOCAL doc_pipeline_module.js in Chromium (about:blank + CDN
    # pdf-lib). The CDN-HEAVY goldens (render-verification's font fetches,
    # Writing Check's ~10MB Harper WASM) live in the non-blocking job below —
    # network flake must not mask a real structure regression here.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm install --no-audit --no-fund
      - id: browsers
        name: Install Playwright chromium
        run: npx playwright install chromium
      # Each golden below is an independent suite, so each runs whenever setup succeeded. A plain
      # step runs only if every earlier step passed: from 2026-09-15 a fault-injection timeout
      # SKIPPED the remediation corpus (the only real-bytes fixAndVerifyPdf run here) in every
      # run. `!cancelled()` keeps later goldens running after one fails; the job still fails.
      - name: Tag-tree golden master (createTaggedPdf structure invariants + round-trip)
        if: ${{ !cancelled() && steps.browsers.outcome == 'success' }}
        run: npx playwright test tests/e2e/pdf_tag_tree_golden.spec.ts
      - name: PdfValidator discrimination (the on-export self-check isn't vacuous)
        if: ${{ !cancelled() && steps.browsers.outcome == 'success' }}
        run: npx playwright test tests/e2e/pdf_validator_golden.spec.ts
      - name: Validator parity (in-app rules vs declaration gate)
        if: ${{ !cancelled() && steps.browsers.outcome == 'success' }}
        run: npx playwright test tests/e2e/validator_parity_golden.spec.ts
      - name: Multi-page cross-page MCR linkage
        if: ${{ !cancelled() && steps.browsers.outcome == 'success' }}
        run: npx playwright test tests/e2e/multipage_golden.spec.ts
      - name: AI-path contracts (scripted Gemini — plan/surgical/rewrite guards)
        if: ${{ !cancelled() && steps.browsers.outcome == 'success' }}
        run: npx playwright test tests/e2e/ai_path_golden.spec.ts
      - name: Install pinned EPUBCheck vendor assets
        if: ${{ !cancelled() && steps.browsers.outcome == 'success' }}
        run: node desktop/mcp/fetch_epubcheck.cjs
      - name: MCP auto-continue closed-loop refinement
        if: ${{ !cancelled() && steps.browsers.outcome == 'success' }}
        # Logging only (~12 KB per test): each test takes 6.2 min here against a 7 min timeout
        # but under 1 min locally, and without the driver's gate lines the log cannot say why.
        env:
          ALLOFLOW_MCP_VERBOSE: '1'
        run: npx playwright test tests/e2e/mcp_auto_continue_golden.spec.ts --workers=1
      - name: STEM golden (Formula role, Headers/IDTree, image-intel honesty)
        if: ${{ !cancelled() && steps.browsers.outcome == 'success' }}
        run: npx playwright test tests/e2e/stem_golden.spec.ts
      - name: Typeset-then-tag golden (Office-input tagged PDFs)
        if: ${{ !cancelled() && steps.browsers.outcome == 'success' }}
        run: npx playwright test tests/e2e/typeset_tagged_golden.spec.ts
      - name: Transcript-format golden (audio/video as first-class input)
        if: ${{ !cancelled() && steps.browsers.outcome == 'success' }}
        run: npx playwright test tests/e2e/transcript_golden.spec.ts
      # PROMOTED TO BLOCKING 2026-07-10 (ChatGPT-review CI item): the two strongest
      # whole-pipeline behavioral suites ran only locally. Both are scripted-Gemini
      # (zero AI network) + the same about:blank/CDN pdf-lib pattern as this job.
      - name: Fault-injection goldens (scheduled model failures → honest degraded results)
        if: ${{ !cancelled() && steps.browsers.outcome == 'success' }}
        run: npx playwright test tests/e2e/remediation_fault_injection_golden.spec.ts
      - name: Remediation corpus (real bytes end-to-end + tagged structural-invariant sweep)
        if: ${{ !cancelled() && steps.browsers.outcome == 'success' }}
        run: npx playwright test tests/e2e/remediation_corpus_golden.spec.ts

  verapdf:
    name: veraPDF ISO 14289-1 ground-truth gate (independent validator)
    # WHY THIS EXISTS: the tag-tree job above validates the exported PDFs against AlloFlow's
    # OWN exported_pdf_validator (a self-check). A reliability reviewer (Garry / Paul at UMaine)
    # would run the INDEPENDENT, ISO-grade veraPDF CLI instead. This job does exactly that: it
    # installs real veraPDF, regenerates the source→tagged artifact pairs the browser goldens
    # produces, and runs dev-tools/verapdf_diff.cjs --gate — which FAILS on any ISO 14289-1 rule
    # that tagging INTRODUCED (the regression class), while excluding the by-design clause-5
    # declaration withholding. Until now the only veraPDF check auto-SKIPPED when the binary was
    # absent (i.e. always, in CI) — so CI was effectively self-grading. This makes the
    # ground-truth gate actually run on every push.
    #
    # PROMOTED TO BLOCKING 2026-09-22. It landed with continue-on-error until the installer and
    # launcher were proven on a real GitHub runner: green in 12 consecutive runs (2026-09-17..22),
    # and the same --gate passed locally on freshly generated pairs (veraPDF 1.30.2, 0 introduced).
    # The job fails loudly, not silently, if veraPDF is missing or produces no artifact pairs, so
    # a green run is real.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - run: npm install --no-audit --no-fund
      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium
      - name: Install veraPDF (official greenfield CLI, headless auto-install)
        run: |
          set -euo pipefail
          python3 -c "from pathlib import Path; import re, xml.etree.ElementTree as ET; p=Path('dev-tools/verapdf_ci_autoinstall.xml'); s=p.read_text(encoding='utf-8'); assert not any('--' in body for body in re.findall(r'<!--(.*?)-->', s, re.S)), 'XML comments may not contain --'; ET.parse(p)"
          curl -fsSL -o "$RUNNER_TEMP/verapdf-installer.zip" https://software.verapdf.org/releases/verapdf-installer.zip
          unzip -q "$RUNNER_TEMP/verapdf-installer.zip" -d "$RUNNER_TEMP/verapdf-installer"
          INSTALLER_JAR="$(find "$RUNNER_TEMP/verapdf-installer" -name 'verapdf-izpack-installer-*.jar' | head -1)"
          test -n "$INSTALLER_JAR" || { echo '::error::veraPDF installer jar not found in download'; exit 1; }
          sed "s#@@INSTALL_DIR@@#$HOME/verapdf#" dev-tools/verapdf_ci_autoinstall.xml > "$RUNNER_TEMP/verapdf-auto-install.xml"
          java -jar "$INSTALLER_JAR" "$RUNNER_TEMP/verapdf-auto-install.xml"
          test -x "$HOME/verapdf/verapdf" || { echo '::error::veraPDF launcher not installed (pack layout changed?)'; ls -la "$HOME/verapdf" 2>/dev/null || true; exit 1; }
          "$HOME/verapdf/verapdf" --version
          echo "VERAPDF_PATH=$HOME/verapdf/verapdf" >> "$GITHUB_ENV"
      - name: Generate source-to-tagged PDF artifact pairs (tag-tree + full remediation)
        run: npx playwright test tests/e2e/pdf_tag_tree_golden.spec.ts tests/e2e/remediation_corpus_golden.spec.ts
      - name: Assert artifact pairs exist (gate must not be vacuous)
        run: |
          set -euo pipefail
          PAIRS="$(ls tests/e2e/artifacts/*.tagged.pdf 2>/dev/null | wc -l)"
          echo "tagged artifacts produced: $PAIRS"
          test -f tests/e2e/artifacts/remediation-e2e.source.pdf || { echo '::error::full-remediation source artifact is missing'; exit 1; }
          test -f tests/e2e/artifacts/remediation-e2e.tagged.pdf || { echo '::error::full-remediation tagged artifact is missing'; exit 1; }
          test "$PAIRS" -gt 0 || { echo '::error::tag-tree golden produced no .tagged.pdf artifacts — the veraPDF gate would be vacuous'; exit 1; }
      - name: veraPDF gate — tagging must not INTRODUCE an ISO 14289-1 failure
        run: node dev-tools/verapdf_diff.cjs --gate
      - name: Upload veraPDF diff record + artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verapdf-diff
          path: |
            a11y-audit/verapdf_diff_result.json
            tests/e2e/artifacts/*.pdf
          if-no-files-found: ignore

  cdn-goldens:
    name: CDN-heavy goldens (non-blocking — network flake tolerated)
    # render-verification fetches substitute fonts (pdfjs-dist CDN), the
    # Writing Check sentinel downloads the real ~10MB Harper WASM, PPTX export
    # builds real OOXML. Real coverage, but a CDN hiccup must not block merges
    # — visible-but-advisory. Promote after observed stability.
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm install --no-audit --no-fund
      - name: Install Playwright chromium
        run: npx playwright install chromium
      - name: Render verification (ink coverage + font-subsetting canary)
        run: npx playwright test tests/e2e/render_verification_golden.spec.ts
      - name: PPTX export golden (OOXML structure + media preservation)
        run: npx playwright test tests/e2e/pptx_export_golden.spec.ts
      - name: Writing Check sentinel (real Harper WASM lint)
        run: npx playwright test tests/e2e/writing_check_golden.spec.ts
      - name: OMML math chain (temml + mathml2omml CDN — Word-native equations)
        run: npx playwright test tests/e2e/omml_math_golden.spec.ts
