<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Course support schedule</title>

<style>
@page { size: Letter; margin: 0.75in; }
:root { color-scheme: light; }
* { box-sizing: border-box; }
html { background: #ffffff; color: #111827; font: 12pt/1.6 Arial, Helvetica, sans-serif; }
body { margin: 0 auto; max-width: 48rem; padding: 1rem; }
.skip-link { position: absolute; left: -10000px; top: auto; }
.skip-link:focus { left: 1rem; top: 1rem; padding: .5rem; background: #ffffff; color: #111827; z-index: 10; }
h1, h2, h3, h4, h5, h6 { color: #111827; line-height: 1.25; break-after: avoid; }
h1 { font-size: 2rem; border-bottom: .18rem solid #1d4ed8; padding-bottom: .3rem; }
h2 { font-size: 1.55rem; margin-top: 1.6rem; }
h3 { font-size: 1.3rem; }
p, li { orphans: 3; widows: 3; }
a { color: #0645ad; text-decoration: underline; text-underline-offset: .12em; }
blockquote { border-left: .3rem solid #475569; margin-left: 0; padding-left: 1rem; }
table { border-collapse: collapse; width: 100%; margin: 1rem 0; break-inside: avoid; }
caption { font-weight: 700; text-align: left; margin-bottom: .35rem; }
/* A ROW must not straddle a page break: `break-inside: avoid` on the table
   cannot help a table taller than a page (the i1040 tax tables run to 180
   rows), so without this a tall row can split and its two halves carry
   different cell counts.
   HONEST SCOPE: this is good practice for tagged output, but it did NOT
   resolve the one remaining PDF/UA-1 clause 7.2 failure on the i1040 rebuild
   - that count was 1 both before and after. Kept because it is correct, not
   because it was shown to fix that case. */
tr, th, td { break-inside: avoid; }
th, td { border: 1px solid #4b5563; padding: .45rem; text-align: left; vertical-align: top; }
th { background: #e5e7eb; color: #111827; }
img { display: block; height: auto; max-width: 100%; }
figcaption, .alloflow-figure-caption { margin-top: .35rem; color: #374151; }
.alloflow-figure-fallback { border: 2px solid #6b7280; padding: .75rem; }
.alloflow-page-break { display: block; break-before: page; height: 0; }
.alloflow-review-notes { break-before: page; margin-top: 2.5rem; border-top: .18rem solid #4b5563; padding-top: 1rem; font-size: .95rem; }
.alloflow-review-notes h2 { font-size: 1.3rem; }
@media print {
  body { max-width: none; padding: 0; }
  .skip-link { display: none; }
  h1, blockquote, th, td, .alloflow-figure-fallback { border: 0; }
  th { background: #ffffff; }
}
</style>
</head>
<body data-alloflow-portable-version="0.2.9">
<a class="skip-link" href="#main-content" title="Skip to main content" aria-label="Skip to main content">Skip to main content</a>
<main id="main-content">
<h1 data-source-page="1">Course support schedule</h1>
<table data-source-page="1"><caption>Weekly support services</caption><thead><tr><th scope="col">Day</th><th scope="col">Service</th><th scope="col">Location</th></tr></thead><tbody><tr><th scope="row">Monday</th><td>Tutoring</td><td>Library</td></tr><tr><th scope="row">Tuesday</th><td>Captioning</td><td>Room 204</td></tr></tbody></table>
</main>
</body>
</html>
