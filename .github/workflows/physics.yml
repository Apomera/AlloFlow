name: Physics simulator

permissions:
  contents: read

on:
  pull_request:
    paths:
      - 'stem_lab/stem_tool_physics.js'
      - 'desktop/web-app/public/stem_lab/stem_tool_physics.js'
      - 'tests/physics_*.test.js'
      - 'tests/e2e/*physics*.spec.ts'
      - 'tests/e2e/helpers/stem_gl_harness.ts'
      - '.github/workflows/physics.yml'
  workflow_dispatch:

jobs:
  physics:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm install --no-audit --no-fund
      - name: Install local React harness
        run: npm install --no-audit --no-fund --no-save --prefix desktop/web-app react@^18.2.0 react-dom@^18.2.0
      - run: npx playwright install chromium
      - name: Numerical, saved-state and learning contracts
        run: npx vitest run tests/physics_ --maxWorkers=1
      - name: Local browser behavior, flight integrity and themes
        run: npx playwright test tests/e2e/72-physics-lab-behaviour.spec.ts tests/e2e/75-physics-theme-contrast.spec.ts tests/e2e/physics-flight-integrity.spec.ts tests/e2e/physics-model-comparison.spec.ts tests/e2e/physics-investigations.spec.ts tests/e2e/physics-launch-height.spec.ts tests/e2e/physics-visual-layout.spec.ts tests/e2e/physics-sample-inspection.spec.ts tests/e2e/physics-clarity.spec.ts tests/e2e/physics-flight-history.spec.ts tests/e2e/physics-comparison-visuals.spec.ts tests/e2e/physics-energy-visuals.spec.ts --workers=1 --retries=0
