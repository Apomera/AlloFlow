<svg xmlns="http://www.w3.org/2000/svg" id="perception-stage-current" viewBox="0 0 800 480" role="img" aria-labelledby=":r8:-title :r8:-desc" width="800" height="480" style="background:#fff;overflow:hidden"><title id=":r8:-title">Ponzo perspective</title><desc id=":r8:-desc">Two orange horizontal bars between perspective rails. Adjust the rails or upper bar position, then compare their apparent lengths. Surroundings visible. Both horizontal bars: 240 drawing units. Their horizontal endpoints align.</desc><rect width="800" height="480" fill="#ffffff"/><line x1="330" y1="40" x2="100" y2="440" stroke="#173b52" stroke-width="5" data-perception-rail="left" data-perception-context="true"/><line x1="470" y1="40" x2="700" y2="440" stroke="#173b52" stroke-width="5" data-perception-rail="right" data-perception-context="true"/><rect x="280" y="215" width="240" height="12" fill="#ed761c" data-perception-target="upper"/><rect x="280" y="344" width="240" height="12" fill="#ed761c" data-perception-target="lower"/><line x1="280" y1="199" x2="280" y2="372" stroke="#c2410c" stroke-width="3" stroke-dasharray="7 5" data-perception-guide="true"/><line x1="520" y1="199" x2="520" y2="372" stroke="#c2410c" stroke-width="3" stroke-dasharray="7 5" data-perception-guide="true"/><text x="400" y="191" fill="#9a3412" font-size="20" text-anchor="middle" font-family="system-ui, sans-serif">240 units</text><text x="400" y="392" fill="#9a3412" font-size="20" text-anchor="middle" font-family="system-ui, sans-serif">240 units</text></svg>