  <!-- The React splash embeds its small rainbow image; no network image preload is needed. -->
  <link rel="preload" as="font" type="font/woff2" href="./fonts/Inter-latin.woff2" crossorigin />
  <script>
    // Register service worker to cache assets and bypass QUIC protocol issues
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js', { updateViaCache: 'none' }).then(function (reg) {
        console.log('[AlloFlow] Service worker registered');
        // Download updates quietly. They activate after open AlloFlow tabs close,
        // so a deployment never interrupts a live classroom or QR join.
        reg.addEventListener('updatefound', function () {
          var newSW = reg.installing;
          if (!newSW) return;
          newSW.addEventListener('statechange', function () {
            if (newSW.state === 'installed' && navigator.serviceWorker.controller) {
              window.__alloUpdateReady = true;
              window.dispatchEvent(new CustomEvent('alloflow:update-ready'));
            }
          });
        });
      }).catch(function (err) {
        console.warn('[AlloFlow] SW registration failed:', err);
      });
    }
  </script>
  <!-- AI Backend: Firebase Shim + WebSearchProvider + AIProvider (must load before React bundle) -->
  <script id="alloflow-ai-backend-script" src="./ai_backend_module.js" defer></script>
  <!-- Narrow cross-origin bridge for the isolated Electron command-center preview. -->
  <script src="%PUBLIC_URL%/alloflow_desktop_bridge.js" defer></script>
  <!-- DragDropTouch polyfill: makes HTML5 native drag-and-drop work on touch devices (iPad / Android tablet).
       Without this, all sort games' draggable items silently fail on touch.
       Attaches to all `draggable` elements on load; no code changes needed elsewhere. -->
  <script src="%PUBLIC_URL%/vendor/drag-drop-touch-2.0.3.esm.min.js?autoload"
    type="module"></script>

<body class="alloflow-workspace-concealed">
  <noscript>You need to enable JavaScript to run AlloFlow.</noscript>
  <div id="root"></div>
  <div id="alloflow-loader"
    style="position:fixed;top:0;left:0;right:0;bottom:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#0f172a;color:#e2e8f0;font-family:Inter,sans-serif;z-index:99999;">
    <div style="font-size:1.5rem;font-weight:700;margin-bottom:1rem;">AlloFlow</div>
    <div id="loader-status" role="status" aria-live="polite" style="font-size:0.875rem;color:#94a3b8;max-width:32rem;padding:0 1rem;text-align:center;">Loading...</div>
    <div id="loader-timer" style="font-size:0.75rem;color:#94a3b8;margin-top:0.5rem;"></div>
    <div id="loader-help" hidden style="max-width:32rem;padding:0 1rem;text-align:center;font-size:0.875rem;line-height:1.5;"></div>
  </div>
  <script>
    // A slow first load offers Reload first. Nothing is deleted unless the person
    // opens Troubleshoot, asks to clear, and then confirms a second time.
    (function () {
      var start = Date.now();
      var statusEl = document.getElementById('loader-status');
      var timerEl = document.getElementById('loader-timer');
      var helpEl = document.getElementById('loader-help');
      var btnBase = 'min-height:44px;padding:0.5rem 1rem;border-radius:0.375rem;cursor:pointer;font-size:0.875rem;font-weight:600;margin:0.25rem;';
      var styles = {
        primary: btnBase + 'border:none;background:#4f46e5;color:#fff;',
        secondary: btnBase + 'border:1px solid #94a3b8;background:transparent;color:#e2e8f0;',
        danger: btnBase + 'border:none;background:#b91c1c;color:#fff;'
      };
      function el(tag, text, style) {
        var node = document.createElement(tag);
        if (text) node.textContent = text;
        if (style) node.setAttribute('style', style);
        return node;
      }
      function button(text, kind, onClick) {
        var b = el('button', text, styles[kind]);
        b.type = 'button';
        b.addEventListener('click', onClick);
        return b;
      }
      function localDate() {
        var d = new Date();
        return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
      }
      function readDb(name) {
        return new Promise(function (resolve) {
          var out = { name: name, stores: {} };
          var req;
          try { req = indexedDB.open(name); } catch (e) { out.error = 'could not open'; resolve(out); return; }
          req.onupgradeneeded = function () { try { req.transaction.abort(); } catch (e) {} };
          req.onerror = function () { out.error = 'could not open'; resolve(out); };
          req.onsuccess = function () {
            var db = req.result;
            var names = Array.prototype.slice.call(db.objectStoreNames);
            out.version = db.version;
            if (!names.length) { db.close(); resolve(out); return; }
            var tx = db.transaction(names, 'readonly');
            names.forEach(function (storeName) {
              var store = tx.objectStore(storeName);
              var keys = store.getAllKeys();
              var values = store.getAll();
              values.onsuccess = function () { out.stores[storeName] = { keys: keys.result, values: values.result }; };
            });
            tx.oncomplete = tx.onerror = tx.onabort = function () { try { db.close(); } catch (e) {} resolve(out); };
          };
        });
      }
      function backup(statusLine) {
        statusLine.textContent = 'Preparing the file...';
        var local = {};
        try { for (var i = 0; i < localStorage.length; i++) { var k = localStorage.key(i); local[k] = localStorage.getItem(k); } } catch (e) {}
        var list = (window.indexedDB && indexedDB.databases) ? indexedDB.databases().catch(function () { return []; }) : Promise.resolve([]);
        return list.then(function (dbs) {
          return Promise.all(dbs.map(function (d) { return readDb(d.name); }));
        }).then(function (databases) {
          var skipped = 0;
          var json = JSON.stringify({ app: 'AlloFlow', savedAt: new Date().toISOString(), localStorage: local, indexedDB: databases }, function (key, value) {
            if ((typeof Blob !== 'undefined' && value instanceof Blob) || value instanceof ArrayBuffer || ArrayBuffer.isView(value)) { skipped++; return { skipped: 'binary data (audio or images) not included' }; }
            return value;
          });
          var url = URL.createObjectURL(new Blob([json], { type: 'application/json' }));
          var a = el('a');
          a.href = url;
          a.download = 'alloflow-saved-data-' + localDate() + '.json';
          document.body.appendChild(a);
          a.click();
          setTimeout(function () { URL.revokeObjectURL(url); a.remove(); }, 1000);
          statusLine.textContent = 'Downloaded ' + a.download + '. Keep this file.' + (skipped ? ' Audio and images are not included.' : '');
        }).catch(function () { statusLine.textContent = 'The copy could not be made in this browser.'; });
      }
      function clearAndReload() {
        try { localStorage.clear(); } catch (e) {}
        try { sessionStorage.clear(); } catch (e) {}
        var list = (window.indexedDB && indexedDB.databases) ? indexedDB.databases().catch(function () { return []; }) : Promise.resolve([]);
        var reload = function () { location.reload(); };
        list.then(function (dbs) {
          return Promise.all(dbs.map(function (d) {
            return new Promise(function (resolve) {
              var req = indexedDB.deleteDatabase(d.name);
              req.onsuccess = req.onerror = req.onblocked = function () { resolve(); };
            });
          }));
        }).then(reload, reload);
        setTimeout(reload, 3000);
      }
      function showHelp() {
        statusEl.textContent = 'Loading is taking longer than expected. Everything saved on this device is still here.';
        helpEl.hidden = false;
        var actions = el('div', '', 'margin-top:0.75rem;');
        var panel = el('div', '', 'margin-top:0.75rem;text-align:left;color:#cbd5e1;');
        panel.id = 'loader-troubleshoot';
        panel.hidden = true;
        var reloadBtn = button('Reload', 'primary', function () { location.reload(); });
        reloadBtn.id = 'loader-reload';
        var troubleBtn = button('Troubleshoot', 'secondary', function () {
          panel.hidden = !panel.hidden;
          troubleBtn.setAttribute('aria-expanded', panel.hidden ? 'false' : 'true');
        });
        troubleBtn.id = 'loader-troubleshoot-toggle';
        troubleBtn.setAttribute('aria-expanded', 'false');
        troubleBtn.setAttribute('aria-controls', 'loader-troubleshoot');
        actions.appendChild(reloadBtn);
        actions.appendChild(troubleBtn);
        panel.appendChild(el('p', 'AlloFlow is still downloading. A slow or busy school network can take a minute or two, especially when a whole class opens it at the same time. Reload keeps everything saved on this device.'));
        panel.appendChild(el('p', 'If Reload does not help, wait a few minutes and try again, or open AlloFlow in a different browser.', 'margin-top:0.5rem;'));
        var backupLine = el('p', '', 'margin-top:0.5rem;min-height:1.5em;');
        backupLine.setAttribute('role', 'status');
        var backupBtn = button('Download a copy of saved work', 'secondary', function () { backup(backupLine); });
        backupBtn.id = 'loader-backup';
        panel.appendChild(el('p', 'Before clearing anything, download a copy of what this browser has saved (settings, projects and student work).', 'margin-top:0.75rem;'));
        panel.appendChild(backupBtn);
        panel.appendChild(backupLine);
        var confirmBox = el('div', '', 'margin-top:0.75rem;padding:0.75rem;border:1px solid #f87171;border-radius:0.375rem;');
        confirmBox.id = 'loader-clear-confirm';
        confirmBox.hidden = true;
        var warning = el('p', 'This deletes everything AlloFlow saved in this browser, including projects and student work that were not downloaded or exported. It cannot be undone.', 'color:#fecaca;font-weight:600;');
        warning.id = 'loader-clear-warning';
        warning.tabIndex = -1;
        confirmBox.appendChild(warning);
        var confirmBtn = button('Delete saved data and reload', 'danger', clearAndReload);
        confirmBtn.id = 'loader-clear-confirmed';
        var cancelBtn = button('Cancel', 'secondary', function () { confirmBox.hidden = true; clearBtn.hidden = false; clearBtn.focus(); });
        cancelBtn.id = 'loader-clear-cancel';
        confirmBox.appendChild(confirmBtn);
        confirmBox.appendChild(cancelBtn);
        var clearBtn = button('Clear saved data...', 'secondary', function () { confirmBox.hidden = false; clearBtn.hidden = true; warning.focus(); });
        clearBtn.id = 'loader-clear';
        panel.appendChild(el('p', 'Clearing saved data is a last resort.', 'margin-top:0.75rem;'));
        panel.appendChild(clearBtn);
        panel.appendChild(confirmBox);
        helpEl.appendChild(actions);
        helpEl.appendChild(panel);
      }
      var interval = setInterval(function () {
        var elapsed = ((Date.now() - start) / 1000).toFixed(1);
        if (timerEl) timerEl.textContent = elapsed + 's elapsed';
        var root = document.getElementById('root');
        if (root && root.children.length > 0) {
          var loader = document.getElementById('alloflow-loader');
          if (loader) loader.style.display = 'none';
          clearInterval(interval);
          return;
        }
        if (parseFloat(elapsed) > 20 && helpEl && helpEl.hidden && !helpEl.childNodes.length) showHelp();
      }, 500);
    })();
  </script>
</body>

</html>
