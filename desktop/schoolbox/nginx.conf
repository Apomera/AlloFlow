upstream ollama_backend {
    server ollama:11434;
}

upstream pocketbase_backend {
    server pocketbase:8090;
}

upstream piper_backend {
    server piper:10200;
}

upstream searxng_backend {
    server searxng:8080;
}

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Standard well-known paths stay reachable; everything else dot-prefixed is denied.
    location ^~ /.well-known/ {
        try_files $uri =404;
    }

    location ~ /\. {
        deny all;
        return 404;
    }

    location /api/ollama/ {
        proxy_pass http://ollama_backend/;
        proxy_hide_header Server;
        proxy_hide_header X-Powered-By;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
        proxy_buffering off;
    }

    location /api/pocketbase/ {
        proxy_pass http://pocketbase_backend/api/;
        proxy_hide_header Server;
        proxy_hide_header X-Powered-By;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 300s;
        proxy_buffering off;
    }

    location = /api/health {
        proxy_pass http://pocketbase_backend/api/health;
        proxy_hide_header Server;
        proxy_hide_header X-Powered-By;
    }

    location /api/piper/ {
        proxy_pass http://piper_backend/;
        proxy_hide_header Server;
        proxy_hide_header X-Powered-By;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/search/ {
        proxy_pass http://searxng_backend/;
        proxy_hide_header Server;
        proxy_hide_header X-Powered-By;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 7d;
        add_header Cache-Control "public";
        # add_header does not inherit once set at this level - repeat them.
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;
    }

    client_max_body_size 50M;
    keepalive_timeout 10s;
    server_tokens off;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1024;
}
