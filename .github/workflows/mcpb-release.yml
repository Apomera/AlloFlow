name: mcpb-release

# Builds the local-first Claude Desktop extension. No Worker, Cloudflare account, hosted
# document processing, Gemini key, or student document is used by this workflow.
on:
  workflow_dispatch:
  push:
    tags:
      - 'mcpb-v*'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/mcpb-release.yml'
      - 'desktop/mcp/**'
      - 'agent_core_*_module.js'
      - 'desktop/web-app/public/agent_core_*_module.js'
      - 'AlloFlowANTI.txt'
      - 'desktop/web-app/src/App.jsx'
      - 'desktop/web-app/src/AlloFlowANTI.txt'
      - 'view_math_source.jsx'
      - 'view_math_module.js'
      - 'desktop/web-app/public/view_math_module.js'
      - 'verification_policy_module.js'
      - 'doc_builder_renderer_module.js'
      - 'doc_pipeline_source.jsx'
      - 'doc_pipeline_module.js'
      - '_build_doc_pipeline_module.js'
      - 'view_pdf_validator_module.js'
      - 'view_pdf_audit_module.js'
      - 'verapdf/**'
      - 'dev-tools/mcp_capability_inventory.cjs'
      - 'dev-tools/verify_mcp_security.cjs'
      - 'dev-tools/security/test-mcp-runtime-dependencies.cjs'
      - 'tests/mcp_bundle_audit_security.test.cjs'
      - 'tests/mcp_ace_browser_security.test.cjs'
      - 'tests/mcp_artifact_source_bytes.test.cjs'
      - 'dev-tools/sync_static_svg_policy.cjs'
      - 'dev-tools/check_agent_core_mirrors.cjs'
      - 'tests/mcp_security_runner.test.js'
      - 'tests/mcp_agent_security.test.js'
      - 'tests/mcp_http_transport.test.js'
      - 'tests/mcp_configuration_security.test.js'
      - 'tests/mcp_svg_security.test.js'
      - 'tests/sanitize_html_dom.test.js'
      - 'tests/agent_core_pack_media_budgets.test.js'
      - 'tests/agent_core_pack_validation_budget.test.js'
      - 'tests/agent_core_media_security.test.js'
      - 'tests/agent_core_native_pack_media.test.js'
      - 'tests/mcp_epub_archive_security.test.js'
      - 'tests/mcp_epub_validation.test.js'
      - 'tests/mcp_stdio_smoke.test.js'
      - 'tests/mcp_native_pack.test.js'
      - 'tests/mcp_illustrated_pack.test.js'
      - 'tests/setup.js'
      - 'tests/helpers/**'
      - 'test_data/agent_core/**'
      - 'allopacks/**'
      - 'vitest.config.js'
      - 'tests/mcp_remediation_stdio_smoke.test.js'
      - 'tests/mcp_agent_bridge_e2e.test.js'
      - 'tests/mcp_agent_bridge_restart_e2e.test.js'
      - 'tests/mcp_agent_bridge_terminal_modes_e2e.test.js'
      - 'tests/remediation_visibility_selector_recovery.test.js'
      - 'tests/doc_pipeline_inherited_contrast.test.js'
      - 'tests/doc_pipeline_placeholder_audit_payload.test.js'
      - 'tests/aifix_chunk_boundary_whitespace.test.js'
      - 'tests/doc_pipeline_focus_wrap_browser.test.js'
      - 'tests/static_crop_cleanup.test.js'
      - 'tests/generated_baseline_language.test.js'
      - 'tests/doc_pipeline_title_attributes.test.js'
      - 'tests/semantic_list_marker_coverage.test.js'
      - 'tests/mcp_content_coverage.test.js'
      - 'tests/mcp_narration_languages.test.js'
      - 'tests/desktop_mcp_durable_jobs.test.js'
      - 'tests/desktop_mcp_residual_hardening.test.js'
      - 'tests/desktop_mcp_runtime_build_drift.test.js'
      - 'tests/desktop_mcp_completion_manifest_race.test.js'
      - 'tests/batch_checkpoint_boundary_commit.test.js'
      - 'tests/doc_pipeline_build_parity.test.js'
      - 'tests/mcp_verifier_packaging_hardening.test.js'
      - 'tests/mcp_call_cli.test.js'
      - 'tests/mcpb_release_workflow.test.js'
      - 'tests/mcp_checkpoint_extraction_contract.test.js'
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: read

concurrency:
  group: mcpb-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Verify and package MCPB
    runs-on: windows-latest
    steps:
      - name: Enable Git long paths before checkout
        shell: pwsh
        run: git config --global core.longpaths true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - name: Install pinned test dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify fail-closed packaged audit handling and source parity
        run: node --test tests/mcp_bundle_audit_security.test.cjs tests/mcp_artifact_source_bytes.test.cjs
      - name: Verify MCP security boundaries and shared policies
        run: npm run verify:mcp-security
      - name: Install Chromium for app-to-MCP parity
        run: npx playwright install chromium
      # EPUBCheck is not in git (vendor/epubcheck is fetched and hash-verified at build time), but
      # the parity smoke stages the vendor directory and verifies every manifest entry, so it must
      # exist before that step runs. mcpb-v0.11.2 failed here on the runner for exactly this reason.
      - name: Materialize manifest-verified EPUBCheck dependencies
        run: node desktop/mcp/fetch_epubcheck.cjs
      - name: Verify canonical app-to-MCP parity
        run: npm run verify:mcp-parity
      - name: Verify MCP durability, cancellation, packaging, and release triggers
        run: >-
          npx vitest run
          tests/desktop_mcp_durable_jobs.test.js
          tests/desktop_mcp_residual_hardening.test.js
          tests/desktop_mcp_runtime_build_drift.test.js
          tests/desktop_mcp_completion_manifest_race.test.js
          tests/batch_checkpoint_boundary_commit.test.js
          tests/doc_pipeline_build_parity.test.js
          tests/mcp_verifier_packaging_hardening.test.js
          tests/mcp_epub_archive_security.test.js
          tests/mcp_epub_validation.test.js
          tests/mcp_checkpoint_extraction_contract.test.js
          tests/mcp_call_cli.test.js
          tests/mcpb_release_workflow.test.js
          tests/mcp_agent_bridge_e2e.test.js
          tests/mcp_agent_bridge_restart_e2e.test.js
          tests/mcp_agent_bridge_terminal_modes_e2e.test.js
          tests/remediation_visibility_selector_recovery.test.js
          tests/doc_pipeline_inherited_contrast.test.js
          tests/doc_pipeline_placeholder_audit_payload.test.js
          tests/aifix_chunk_boundary_whitespace.test.js
          tests/doc_pipeline_focus_wrap_browser.test.js
          tests/static_crop_cleanup.test.js
          tests/generated_baseline_language.test.js
          tests/doc_pipeline_title_attributes.test.js
          tests/semantic_list_marker_coverage.test.js
          tests/mcp_content_coverage.test.js
          tests/mcp_narration_languages.test.js
          --maxWorkers=1
          --testTimeout=70000
      - name: Require release tag to match the MCPB manifest version
        if: startsWith(github.ref, 'refs/tags/mcpb-v')
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $manifestVersion = node -p "require('./desktop/mcp/build_mcpb.cjs').buildManifest().version"
          $tagVersion = $env:RELEASE_TAG -replace '^mcpb-v', ''
          if ($manifestVersion -ne $tagVersion) {
            throw "Tag $env:RELEASE_TAG does not match MCPB manifest version $manifestVersion."
          }
      - name: Build, officially validate, extract, and boot-check the exact MCPB
        run: node desktop/mcp/build_mcpb.cjs
      # Fails on any high/critical advisory in the staged bundle that is not listed, with a written
      # justification and an expiry, in desktop/mcp/audit_allowlist.json. Accepted advisories are
      # printed here so the release log carries the disclosure; expired or stale entries also fail.
      - name: Audit the dependencies actually bundled
        run: node desktop/mcp/audit_bundle_dependencies.cjs --prefix desktop/dist/mcpb/staging --level high
      - name: Write checksums, dependency SBOM, and vendor evidence
        shell: pwsh
        run: |
          $dist = 'desktop/dist/mcpb'
          $artifact = Get-Item "$dist/alloflow-remediation.mcpb"
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $artifact.FullName).Hash.ToLowerInvariant()
          # LF, no BOM: Set-Content on the Windows runner wrote CRLF, so `sha256sum -c SHA256SUMS.txt`
          # (the check the release notes and pilot guide tell people to run) failed on macOS and
          # Linux with "alloflow-remediation.mcpb\r: No such file or directory" (seen on mcpb-v0.11.3).
          [IO.File]::WriteAllText((Join-Path (Get-Location) "$dist/SHA256SUMS.txt"), "$hash  $($artifact.Name)`n", (New-Object System.Text.UTF8Encoding $false))
          $manifestVersion = node -p "require('./desktop/mcp/build_mcpb.cjs').buildManifest().version"
          node desktop/mcp/build_registry_metadata.cjs --artifact "$dist/alloflow-remediation.mcpb" --tag "mcpb-v$manifestVersion" --output "$dist/server.json"
          # Staging is installed with --install-links (build_mcpb.cjs), so the file: extract-zip
          # stand-in is a copy, not a link; without the same flag npm sbom calls it invalid.
          npm sbom --prefix "$dist/staging" --omit=dev --install-links --sbom-format=cyclonedx |
            Out-File -Encoding utf8 "$dist/alloflow-remediation.cdx.json"
          node -e "JSON.parse(require('fs').readFileSync('$dist/alloflow-remediation.cdx.json','utf8').replace(/^\uFEFF/,''))"
          Copy-Item desktop/mcp/vendor/manifest.json "$dist/vendor-manifest.json"
          Copy-Item desktop/mcp/vendor/THIRD_PARTY_NOTICES.md "$dist/THIRD_PARTY_NOTICES.md"
          $releaseDir = "$dist/release"
          New-Item -ItemType Directory -Path $releaseDir -Force | Out-Null
          Copy-Item "$dist/alloflow-remediation.mcpb","$dist/SHA256SUMS.txt","$dist/server.json","$dist/alloflow-remediation.cdx.json","$dist/vendor-manifest.json","$dist/THIRD_PARTY_NOTICES.md",desktop/mcp/MCPB_RELEASE.md,desktop/mcp/PRIVACY.md $releaseDir
      - name: Upload verified installable and integrity evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: alloflow-remediation-mcpb-${{ github.sha }}
          if-no-files-found: error
          path: desktop/dist/mcpb/release/*

  # PR code and dependency installation receive only the default read token.
  # Attestation uses the verified artifact on trusted tag pushes and runs no source.
  attest:
    name: Attest verified tagged artifacts
    if: github.event_name == 'push' && github.repository == 'Apomera/AlloFlow' && startsWith(github.ref, 'refs/tags/mcpb-v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: alloflow-remediation-mcpb-${{ github.sha }}
          path: release-assets
      - name: Attest release build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: release-assets/alloflow-remediation.mcpb
      - name: Attest the CycloneDX dependency SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: release-assets/alloflow-remediation.mcpb
          sbom-path: release-assets/alloflow-remediation.cdx.json

  release:
    name: Publish tagged GitHub release
    if: github.event_name == 'push' && github.repository == 'Apomera/AlloFlow' && startsWith(github.ref, 'refs/tags/mcpb-v')
    needs: [build, attest]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: alloflow-remediation-mcpb-${{ github.sha }}
          path: release-assets
      - name: Create tag release or repair its assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:RELEASE_TAG release-assets/* --clobber --repo $env:GITHUB_REPOSITORY
          } else {
            gh release create $env:RELEASE_TAG release-assets/* --verify-tag --repo $env:GITHUB_REPOSITORY --title "AlloFlow Remediation MCP $env:RELEASE_TAG" --notes-file desktop/mcp/MCPB_RELEASE.md
          }
