roke="#4f46e5" stroke-width="2"/><path d="M 132 110 A 32 32 0 1 0 100 142" fill="none" stroke="#4f46e5"/><circle cx="100" cy="110" r="3" fill="#475569"/><text x="130" y="96" font-size="14" font-weight="bold" fill="#4f46e5">270°</text></svg></article><article><h2>Full turn</h2><svg viewBox="0 0 220 220" role="img" aria-label="Full turn: An angle of 360 degrees between a horizontal ray and a second ray." width="100%" style="max-width:240px"><title>Full turn</title><desc>An angle of 360 degrees between a horizontal ray and a second ray.</desc><line x1="100" y1="110" x2="184" y2="110" stroke="#475569" stroke-width="2"/><line x1="100" y1="110" x2="184.0" y2="110.0" stroke="#4f46e5" stroke-width="2"/><circle cx="100" cy="110" r="32" fill="none" stroke="#4f46e5"/><circle cx="100" cy="110" r="3" fill="#475569"/><text x="130" y="96" font-size="14" font-weight="bold" fill="#4f46e5">360°</text></svg></article><article><h2>Ten-frame</h2><svg viewBox="0 0 260 134" role="img" aria-label="Ten-frame: 7" width="100%" style="max-width:320px"><title>Ten-frame</title><desc>Ten-frame: 7</desc><rect x="14" y="14" width="44" height="44" fill="white" stroke="#475569"/><circle cx="36" cy="36" r="15" fill="#4f46e5" stroke="#334155"/><rect x="58" y="14" width="44" height="44" fill="white" stroke="#475569"/><circle cx="80" cy="36" r="15" fill="#4f46e5" stroke="#334155"/><rect x="102" y="14" width="44" height="44" fill="white" stroke="#475569"/><circle cx="124" cy="36" r="15" fill="#4f46e5" stroke="#334155"/><rect x="146" y="14" width="44" height="44" fill="white" stroke="#475569"/><circle cx="168" cy="36" r="15" fill="#4f46e5" stroke="#334155"/><rect x="190" y="14" width="44" height="44" fill="white" stroke="#475569"/><circle cx="212" cy="36" r="15" fill="#4f46e5" stroke="#334155"/><rect x="14" y="58" width="44" height="44" fill="white" stroke="#475569"/><circle cx="36" cy="80" r="15" fill="#4f46e5" stroke="#334155"/><rect x="58" y="58" width="44" height="44" fill="white" stroke="#475569"/><circle cx="80" cy="80" r="15" fill="#4f46e5" stroke="#334155"/><rect x="102" y="58" width="44" height="44" fill="white" stroke="#475569"/><rect x="146" y="58" width="44" height="44" fill="white" stroke="#475569"/><rect x="190" y="58" width="44" height="44" fill="white" stroke="#475569"/><text x="14" y="122" font-size="14">7</text></svg></article><article><h2>Negative counters</h2><svg viewBox="0 0 260 110" role="img" aria-label="Counters: -3. Yellow is positive; red is negative" width="100%" style="max-width:320px"><title>Negative counters</title><desc>Counters: -3. Yellow is positive; red is negative</desc><circle cx="36" cy="36" r="15" fill="#dc2626" stroke="#334155"/><text x="36" y="41" text-anchor="middle" fill="white">−</text><circle cx="80" cy="36" r="15" fill="#dc2626" stroke="#334155"/><text x="80" y="41" text-anchor="middle" fill="white">−</text><circle cx="124" cy="36" r="15" fill="#dc2626" stroke="#334155"/><text x="124" y="41" text-anchor="middle" fill="white">−</text><text x="14" y="98" font-size="14">-3</text></svg></article><article><h2>Fraction bars</h2><svg viewBox="0 0 320 78" role="img" aria-label="Fraction bars: 2 parts shaded, with 3 equal parts per whole (2/3)." width="100%" style="max-width:360px"><title>Fraction bars</title><desc>2 parts shaded, with 3 equal parts per whole (2/3).</desc><rect x="10" y="12" width="100" height="38" fill="#4f46e5" stroke="#475569" stroke-width="1.5"/><rect x="110" y="12" width="100" height="38" fill="#4f46e5" stroke="#475569" stroke-width="1.5"/><rect x="210" y="12" width="100" height="38" fill="#ffffff" stroke="#475569" stroke-width="1.5"/><text x="160" y="70" font-size="14" font-weight="bold" fill="#4f46e5" text-anchor="middle">2/3</text></svg></article></main></body></html>
