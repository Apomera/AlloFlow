# SearXNG settings for AlloFlow
# Enables JSON API for programmatic access from local AI backends

use_default_settings: true

server:
  # Set SEARXNG_SECRET in docker/.env (32-byte random hex: openssl rand -hex 32).
  limiter: true

search:
  safe_search: 2
  autocomplete: ""
  default_lang: "en"
  formats:
    - html
    - json

ui:
  static_use_hash: true
