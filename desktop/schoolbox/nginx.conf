# Per-device limits: AI requests (POST only, not the model list) and sign-in or password-reset requests.
# An empty key is not counted, so other database traffic and live updates are never limited.
map $request_method $ai_limit_key {
    POST    $binary_remote_addr;
    default "";
}
map $request_uri $signin_limit_key {
    ~^/api/pocketbase/collections/[^/?]+/(auth-with-|request-|confirm-)  $binary_remote_addr;
    default "";
}
limit_req_zone $ai_limit_key zone=ai_per_device:10m rate=60r/m;
limit_req_zone $signin_limit_key zone=signin_per_device:10m rate=20r/m;
limit_req_status 429;

upstream ollama_backend {
    server ollama:11434;
}

upstream pocketbase_backend {
    server pocketbase:8090;
}

upstream piper_backend {
    server piper:10200;
}

upstream searxng_backend {
    server searxng:8080;
}

server {
    listen 80;
    server_name localhost;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Classroom devices may chat with models but not download, delete or replace them.
    location ^~ /api/ollama/ {
        location ~* ^/api/ollama/api/(pull|delete|create|push|copy|blobs)(/|$) {
            return 403;
        }
        limit_req zone=ai_per_device burst=40 nodelay;
        proxy_pass http://ollama_backend/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_buffering off;
    }

    # Block PocketBase admin UI, superuser auth, system collections, and administrative endpoints from browser clients.
    location ^~ /api/pocketbase/ {
        location ~* ^/api/pocketbase/(?:_|api/admins|admins|collections/_superusers|backups|settings|logs|crons|batch)(/|$) {
            return 403;
        }
        location ~* ^/api/pocketbase/(?:collections/?$|collections/(?:_|pbc_|import|meta)(/|$)|collections/(?:_|pbc_)[^/]+(/|$)|collections/[^/]+/truncate(/|$)) {
            return 403;
        }
        limit_req zone=signin_per_device burst=40 nodelay;
        proxy_pass http://pocketbase_backend/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_buffering off;
    }

    location = /api/health {
        proxy_pass http://pocketbase_backend/api/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /api/piper/ {
        proxy_pass http://piper_backend/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /api/search/ {
        proxy_pass http://searxng_backend/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~* \.svg$ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'none'; sandbox; frame-ancestors 'self'" always;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|woff|woff2|ttf|eot)$ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "frame-ancestors 'self'; object-src 'none'; base-uri 'self'" always;
    }

    location ~* \.(json|wasm|onnx|mp3|wav|webm|ogg|m4a)$ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "frame-ancestors 'self'; object-src 'none'; base-uri 'self'" always;
    }

    client_max_body_size 50M;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "0" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "frame-ancestors 'self'; object-src 'none'; base-uri 'self'" always;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1024;
}
