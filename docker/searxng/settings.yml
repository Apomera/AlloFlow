# SearXNG settings for AlloFlow
# Enables JSON API for programmatic access from local AI backends

use_default_settings: true

server:
  # Overridden in docker-compose.yml via SEARXNG_SECRET when set; replace before non-loopback deployment.
  secret_key: "CHANGE_ME_GENERATE_WITH_OPENSSL_RAND_HEX_32"
  limiter: false

search:
  safe_search: 2
  autocomplete: ""
  default_lang: "en"
  formats:
    - html
    - json

ui:
  static_use_hash: true
